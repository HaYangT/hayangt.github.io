profile:
  name: "고혜역"
  role: "Software Engineer"
  headline: "데이터의 흐름과 사용자를 중심으로 서비스의 구조를 설계, 개발하는 개발자"
  greeting: "반갑습니다. SW 엔지니어 고혜역입니다."
  summary: ""
  location: "Korea"
  email: "juliago00@naver.com"
  github: "https://github.com/HaYangT"
  blog: "https://hayangt.github.io"

about:
  - "데이터가 생성되고 이동하며 사용자에게 의미 있는 결과로 도달하기까지의 흐름을 중요하게 봅니다."
  - "사용자 경험과 시스템 안정성을 함께 고려하며, 기능이 실제 서비스 구조 안에서 오래 유지될 수 있는지를 고민합니다."
  - "문서화가 불필요한 커뮤니케이션을 줄이고 문제의 본질에 집중하게 하는 힘이라고 믿습니다."

skills:
  - name: "Front-End"
    items:
      - "React"
      - "React Native"
      - "Vue.js"
      - "TypeScript"
      - "WebRTC"
      - "Electron"
  - name: "Back-End"
    items:
      - "Spring Boot"
      - "JPA"
      - "Node.js"
      - "FastAPI"
      - "MySQL"
      - "MongoDB"
  - name: "AI & Data"
    items:
      - "Model Fine-tuning"
      - "Data Cleaning"
      - "NeuroKit2"
      - "Numba JIT"
      - "LSTM"
  - name: "System & Workflow"
    items:
      - "WebSocket"
      - "Redis"
      - "RabbitMQ"
      - "Celery"
      - "Git"
      - "Documentation"

skill_details:
  - name: "Front-End"
    details:
      - "React, React Native, Vue.js 기반의 웹·모바일 UI를 개발하고 유지보수할 수 있습니다."
      - "TypeScript를 활용해 컴포넌트 props, API 응답 데이터, 상태값의 타입을 명확히 정의하고 안정적인 프론트엔드 코드를 작성할 수 있습니다."
      - "WebRTC, Web Audio API, DataChannel 등을 활용해 실시간 음성 스트리밍 및 데이터 송수신 기능을 구현한 경험이 있습니다."
      - "Electron을 활용해 웹 기반 프론트엔드를 데스크톱 애플리케이션으로 확장하고, 로컬 AI 서버와 연동한 경험이 있습니다."
  - name: "Back-End"
    details:
      - "Spring Boot 기반으로 RESTful API 서버를 개발하고, Controller-Service-Repository 계층 구조에 따라 기능을 구현할 수 있습니다."
      - "Node.js와 FastAPI를 활용해 서비스 목적에 맞는 경량 API 서버를 개발하고 외부 모델 또는 로컬 프로세스와 연동한 경험이 있습니다."
      - "MySQL, MongoDB 등을 활용해 서비스 데이터 구조를 설계하고, 정규화와 반정규화를 고려한 ERD 설계를 수행한 경험이 있습니다."
      - "Redis, RabbitMQ, Celery 등을 활용한 비동기 처리 구조와 작업 큐 기반 아키텍처를 이해하고 있습니다."
  - name: "AI"
    details:
      - "모델 파인 튜닝과 데이터 정제를 통해 AI의 성능을 개선할 수 있습니다."
      - "여러 신경망을 사용하여 분류, 회귀와 같은 기본 모델을 만들 수 있습니다."
  - name: "Collaboration"
    details:
      - "JIRA, GITLAB, GITHUB등 다양한 협업 툴을 사용한 경험이 있습니다."
      - "Commit/PR 메시지, 주석, 작업 티켓 등을 꼼꼼하게 남겨 원활한 협업 환경을 만들기 위해 노력합니다."
      - "문제 해결에 도움이 된다면 새로운 프로그래밍 언어, 라이브러리, 프레임워크, 패러다임을 익히고 실무에 적용하는 것에 거리낌이 없습니다."

projects:
  - title: "HearO"
    tagline: "상담원 보호 서비스"
    period: "2026.01.12 ~ 2026.02.08"
    organization: "SSAFY 첫 번째 팀 프로젝트"
    role: "WebRTC / AI / Electron"
    featured: true
    description: "상담원을 실시간으로 보호하고 지원하는 서비스입니다."
    stack:
      - "WebRTC"
      - "AI"
      - "Electron"
      - "STT"
      - "Unsmile Model"
    links:
      - label: "GitHub"
        url: "https://github.com/wonby1n/HearO"
    contributions:
      - title: "상담원 - 고객 - AI 간 파이프라인 설계 및 구현"
        body: "상담원과 고객 사이의 폭언 기반 음성 필터링 기능을 WebRTC를 사용해 개발했습니다."
      - title: "Unsmile Model 파인튜닝"
        body: "Unsmile Model에 상담 내용과 관련 없는 단어들에 가중치를 두어 폭언 탐지의 정확도를 높였습니다."
      - title: "Electron을 활용한 AI-FrontEnd 간 LifeCycle 관리"
        body: "사용자의 편의와 사용성을 고려하여 AI와 FrontEnd의 생명주기를 Electron으로 관리했습니다."
  - title: "ENCO"
    tagline: "투명한 모임 통장"
    period: "2026.02.19 ~ 2026.03.30"
    organization: "SSAFY 두 번째 팀 프로젝트"
    role: "React Native / WebSocket"
    featured: true
    description: "투표와 위치 기반 기능을 포함한 모임 통장 서비스입니다."
    stack:
      - "React Native"
      - "NativeWind"
      - "WebSocket"
    contributions:
      - title: "React Native와 NativeWind를 사용한 프론트엔드 구현"
        body: "사용자 편의와 보안을 고려한 FrontEnd를 설계하고 개발했습니다."
      - title: "WebSocket을 이용한 채팅방 구현"
        body: "WebSocket을 사용해 채팅방 기능을 구현했습니다."
  - title: "Caredio"
    tagline: "뇌전증 환자를 위한 심전도 기반 전조 예측 서비스"
    period: "2026.04.06 ~ 2026.05.21"
    organization: "SSAFY 세 번째 팀 프로젝트 / 오션스바이오 기업 연계"
    role: "ERD / 실시간 ECG 분석 / 성능 최적화"
    featured: true
    description: "심전도 기반 뇌전증 전조 예측을 위해 실시간 ECG 수신, Sliding Window Batch 구성, 전처리 최적화를 수행한 서비스입니다."
    stack:
      - "ECG"
      - "ERD"
      - "NeuroKit2"
      - "Numba JIT"
      - "Sliding Window"
    contributions:
      - title: "ERD 설계 및 쿼리 최적화"
        body: "Session, Signal, Batch, Feature, Predict Result 간의 관계를 모델링했습니다. 실시간 분석 과정에서 Join이 자주 발생하는 구간은 조회 패턴을 기준으로 반정규화를 적용하여 데이터 접근 속도를 개선했습니다."
      - title: "실시간 ECG 수신 및 Sliding Window 분석 구조 설계"
        body: "10초 단위 ECG 신호를 수신하고, 2분 단위의 Sliding Window Batch를 구성하는 구조를 설계했습니다. Signal과 Batch의 다대다 관계를 중간 테이블로 관리하여 하나의 Signal이 여러 분석 Window에 재사용될 수 있도록 구현했습니다."
      - title: "Numba JIT를 활용한 NeuroKit2 전처리 성능 최적화"
        body: "NeuroKit2 기반 ECG 전처리 과정에서 반복 연산으로 인한 병목을 줄이기 위해 Numba JIT를 적용했습니다. ECG Denoising, Resampling, R-peak Detection 등 분석 전처리 단계의 실행 속도를 개선하고, 2분 Window 기준 전처리 및 HRV Feature 추출이 30초 이내에 완료되도록 검증했습니다."

